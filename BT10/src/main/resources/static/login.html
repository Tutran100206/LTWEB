<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập</title><link rel="stylesheet" href="/style.css"><script src="/mainjs.js" defer></script></head>
<body><main><h1>Đăng nhập</h1><p>JWT với Nimbus JOSE + JWT</p>
<form id="login-form"><label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label>
<label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required maxlength="72"></label><button>Login</button></form>
<p id="message" role="status"></p><details><summary>Tạo tài khoản</summary>
<form id="signup-form"><label>Họ tên<input name="fullName" autocomplete="name" required maxlength="120"></label>
<label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label>
<label>Mật khẩu<input name="password" type="password" autocomplete="new-password" required minlength="6" maxlength="72"></label><button>Đăng ký</button></form>
</details></main></body></html>
