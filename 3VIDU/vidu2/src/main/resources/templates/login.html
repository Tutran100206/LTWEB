<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}"><head><title>Đăng nhập</title></head><body><main layout:fragment="content"><section class="card auth"><p class="eyebrow">Chào mừng trở lại</p><h1>Đăng nhập</h1><p class="muted">Tên đăng nhập hoặc email và mật khẩu của bạn.</p><div class="notice error" role="alert" th:if="${param.error}">Thông tin đăng nhập không đúng hoặc tài khoản chưa được kích hoạt.</div><div class="notice" th:if="${param.logout}">Bạn đã đăng xuất an toàn.</div><form method="post" th:action="@{/login}"><label for="login">Tên đăng nhập hoặc email</label><input id="login" name="login" type="text" autocomplete="username" required autofocus><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="block" type="submit">Đăng nhập</button></form></section></main></body></html>
