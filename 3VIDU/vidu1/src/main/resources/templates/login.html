<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><div th:replace="~{fragments/messages :: messages}"></div><section class="card auth"><p class="eyebrow">Chào mừng trở lại</p><h1>Đăng nhập</h1><p class="muted">Email và mật khẩu của bạn.</p><div class="notice error" role="alert" th:if="${param.error}">Thông tin đăng nhập không đúng hoặc tài khoản chưa được kích hoạt.</div><div class="notice" th:if="${param.logout}">Bạn đã đăng xuất an toàn.</div><form method="post" th:action="@{/login}"><label for="login">Email</label><input id="login" name="email" type="email" autocomplete="username" required autofocus><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="block" type="submit">Đăng nhập</button></form></section></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
