<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quên mật khẩu</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><div th:replace="~{fragments/messages :: messages}"></div><section class="card auth"><p class="eyebrow">Tài khoản của bạn</p><h1>Quên mật khẩu</h1><form method="post" th:action="@{/forgot-password}" th:object="${form}"><div class="notice error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div><label for="email">Email tài khoản</label><input id="email" th:field="*{email}" type="email" ><span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span><button type="submit" class="block">Gửi mã đặt lại mật khẩu</button></form><div class="form-links"><a th:href="@{/login}">Về đăng nhập</a></div></section></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
