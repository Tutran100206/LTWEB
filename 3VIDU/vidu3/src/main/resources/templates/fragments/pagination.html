<div xmlns:th="http://www.thymeleaf.org" th:fragment="pagination" class="pagination"><span th:text="|Trang ${items.number + 1} / ${items.totalPages == 0 ? 1 : items.totalPages} · ${items.totalElements} kết quả|"></span><div class="actions"><a class="button secondary" th:if="${items.hasPrevious()}" th:href="@{${baseUrl}(page=${items.number - 1},size=${items.size},keyword=${keyword})}">← Trước</a><a class="button secondary" th:if="${items.hasNext()}" th:href="@{${baseUrl}(page=${items.number + 1},size=${items.size},keyword=${keyword})}">Sau →</a></div></div>
