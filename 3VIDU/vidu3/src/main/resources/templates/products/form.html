<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thông tin sản phẩm</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><div th:replace="~{fragments/messages :: messages}"></div><section class="card auth"><h1 th:text="${form.id == null ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}"></h1><form method="post" enctype="multipart/form-data" th:action="${form.id == null ? '/products' : '/products/' + form.id}" th:object="${form}"><div class="notice error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div><label for="name">Tên sản phẩm</label><input id="name" th:field="*{name}" type="text" ><span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span><label for="description">Mô tả</label><textarea id="description" rows="4" th:field="*{description}" maxlength="2000"></textarea><label for="price">Giá (VND)</label><input id="price" th:field="*{price}" type="number" min="0" step="0.01"><span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span><div th:if="${currentUser.admin}"><label for="userId">Chủ sở hữu</label><select id="userId" th:field="*{userId}"><option value="">Tài khoản hiện tại</option><option th:each="u : ${owners}" th:value="${u.id}" th:text="|${u.username} — ${u.fullName}|"></option></select></div><label for="image">Ảnh sản phẩm</label><input id="image" type="file" name="image" accept="image/png,image/jpeg,image/gif"><p class="muted">JPG, PNG hoặc GIF, tối đa 5 MB. Bỏ trống để giữ ảnh hiện tại.</p><img class="preview" th:if="${form.imageUrl}" th:src="${form.imageUrl}" alt="Ảnh hiện tại"><button class="block" type="submit">Lưu sản phẩm</button></form><div class="form-links"><a th:href="@{/products}">← Danh sách</a></div></section></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
