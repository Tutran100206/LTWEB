<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý sản phẩm</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><div th:replace="~{fragments/messages :: messages}"></div><section class="card"><div class="toolbar"><div><p class="eyebrow">Không gian sản phẩm</p><h1>Sản phẩm</h1><p class="muted" th:text="${currentUser.admin ? 'Quản lý sản phẩm của tất cả người dùng.' : 'Danh sách sản phẩm thuộc tài khoản của bạn.'}"></p></div><a class="button" th:href="@{/products/create}">+ Thêm sản phẩm</a></div><form class="search" method="get" th:action="@{${baseUrl}}"><input type="search" name="keyword" th:value="${keyword}" placeholder="Nhập từ khóa tìm kiếm" aria-label="Từ khóa"><select name="size" aria-label="Số dòng mỗi trang"><option th:each="s : ${ {5,10,20,50} }" th:value="${s}" th:text="${s}" th:selected="${items.size == s}"></option></select><button type="submit">Tìm kiếm</button></form><div class="table-wrap"><table><thead><tr><th>Ảnh</th><th>Sản phẩm</th><th>Giá (VND)</th><th>Chủ sở hữu</th><th>Ngày tạo</th><th>Thao tác</th></tr></thead><tbody><tr th:each="p : ${items}"><td><img class="product-image" th:src="${p.imageUrl ?: '/images/product.svg'}" th:alt="${p.name}"></td><td><strong th:text="${p.name}"></strong><p class="muted" th:text="${p.description}"></p></td><td th:text="${#numbers.formatDecimal(p.price,1,'POINT',2,'COMMA')}"></td><td th:text="${p.username}"></td><td th:text="${#temporals.format(p.createdAt,'dd/MM/yyyy HH:mm')}"></td><td><div class="actions"><a th:href="@{/products/{id}/edit(id=${p.id})}">Sửa</a><form method="post" th:action="@{/products/{id}/delete(id=${p.id})}" onsubmit="return confirm('Bạn muốn xóa sản phẩm này?')"><button class="danger" type="submit">Xóa</button></form></div></td></tr><tr th:if="${items.empty}"><td colspan="6">Chưa có sản phẩm phù hợp.</td></tr></tbody></table></div><div th:replace="~{fragments/pagination :: pagination}"></div></section></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
