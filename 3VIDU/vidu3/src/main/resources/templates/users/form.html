<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thông tin người dùng</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><div th:replace="~{fragments/messages :: messages}"></div><section class="card auth"><h1 th:text="${form.id == null ? 'Thêm người dùng' : 'Sửa người dùng'}"></h1><form method="post" th:action="${form.id == null ? '/users' : '/users/' + form.id}" th:object="${form}"><input type="hidden" th:field="*{id}"><div class="notice error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div><label for="username">Tên đăng nhập</label><input id="username" th:field="*{username}" type="text" ><span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span><label for="email">Email</label><input id="email" th:field="*{email}" type="email" ><span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span><label for="fullName">Họ và tên</label><input id="fullName" th:field="*{fullName}" type="text" ><span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span><label for="password">Mật khẩu (để trống khi không đổi)</label><input id="password" name="password" type="password" value="" autocomplete="new-password" ><span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span><label for="roleName">Vai trò</label><select id="roleName" th:field="*{roleName}"><option value="USER">USER</option><option value="ADMIN">ADMIN</option></select><label><input type="checkbox" th:field="*{enabled}"> Cho phép đăng nhập</label><button type="submit" class="block">Lưu người dùng</button></form><div class="form-links"><a th:href="@{/users}">← Danh sách</a></div></section></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
