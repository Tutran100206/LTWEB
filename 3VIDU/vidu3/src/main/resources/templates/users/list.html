<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý người dùng</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><div th:replace="~{fragments/messages :: messages}"></div><section class="card"><div class="toolbar"><div><p class="eyebrow">Quản trị</p><h1>Người dùng</h1><p class="muted" th:text="|Tổng số người dùng: ${totalUsers}|"></p></div><a class="button" th:href="@{/users/create}">+ Thêm người dùng</a></div><form class="search" method="get" th:action="@{${baseUrl}}"><input type="search" name="keyword" th:value="${keyword}" placeholder="Nhập từ khóa tìm kiếm" aria-label="Từ khóa"><select name="size" aria-label="Số dòng mỗi trang"><option th:each="s : ${ {5,10,20,50} }" th:value="${s}" th:text="${s}" th:selected="${items.size == s}"></option></select><button type="submit">Tìm kiếm</button></form><div class="table-wrap"><table><thead><tr><th>Người dùng</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Sản phẩm</th><th>Thao tác</th></tr></thead><tbody><tr th:each="u : ${items}"><td><strong th:text="${u.fullName}"></strong><div class="muted" th:text="${u.username}"></div></td><td th:text="${u.email}"></td><td><span class="badge" th:text="${u.roleName}"></span></td><td th:text="${u.enabled ? 'Hoạt động' : 'Chưa kích hoạt'}"></td><td th:text="${u.productCount}"></td><td><div class="actions"><a th:href="@{/users/{id}/edit(id=${u.id})}">Sửa</a><form method="post" th:action="@{/users/{id}/delete(id=${u.id})}" onsubmit="return confirm('Bạn muốn xóa người dùng này?')"><button class="danger" type="submit">Xóa</button></form></div></td></tr><tr th:if="${items.empty}"><td colspan="6">Không tìm thấy người dùng.</td></tr></tbody></table></div><div th:replace="~{fragments/pagination :: pagination}"></div></section></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
