<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đặt lại mật khẩu</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><div th:replace="~{fragments/messages :: messages}"></div><section class="card auth"><p class="eyebrow">Tài khoản của bạn</p><h1>Đặt lại mật khẩu</h1><form method="post" th:action="@{/reset-password}" th:object="${form}"><div class="notice error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div><label for="email">Email</label><input id="email" th:field="*{email}" type="email" ><span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span><label for="code">Mã OTP</label><input id="code" th:field="*{code}" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><span class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></span><label for="password">Mật khẩu mới</label><input id="password" name="password" type="password" value="" autocomplete="new-password" ><span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span><label for="confirmPassword">Nhập lại mật khẩu mới</label><input id="confirmPassword" name="confirmPassword" type="password" value="" autocomplete="new-password" ><span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span><button type="submit" class="block">Lưu mật khẩu mới</button></form><div class="form-links"><a th:href="@{/forgot-password}">Yêu cầu mã mới</a></div><div class="form-links"><a th:href="@{/login}">Về đăng nhập</a></div></section></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
