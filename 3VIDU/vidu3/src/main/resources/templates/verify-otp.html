<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xác thực email</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><div th:replace="~{fragments/messages :: messages}"></div><section class="card auth"><p class="eyebrow">Tài khoản của bạn</p><h1>Xác thực email</h1><form method="post" th:action="@{/verify-otp}" th:object="${form}"><div class="notice error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div><p class="muted">Nhập mã 6 chữ số đã gửi đến email. Mã có hiệu lực trong 5 phút.</p><label for="email">Email</label><input id="email" th:field="*{email}" type="email" ><span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span><label for="code">Mã OTP</label><input id="code" th:field="*{code}" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><span class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></span><button type="submit" class="block">Xác thực tài khoản</button></form><form method="post" th:action="@{/resend-register-otp}"><label for="resendEmail">Email nhận lại mã</label><input id="resendEmail" type="email" name="email" th:value="${form.email}" required><button class="block secondary" type="submit">Gửi lại OTP</button></form><div class="form-links"><a th:href="@{/login}">Về đăng nhập</a></div></section></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
